<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi CV | Contacto</title>

    <link rel="stylesheet"
          href="../style-global.css">

    <link rel="stylesheet"
          href="style.css">

</head>


<body>


    <header>

        <nav class="navbar">

            <a href="../inicio/index.html"
               class="logo">

                Mi CV

            </a>


            <ul class="nav-links">

                <li>
                    <a href="../inicio/index.html">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="../perfil/index.html">
                        Perfil
                    </a>
                </li>

                <li>
                    <a href="../habilidades/index.html">
                        Habilidades
                    </a>
                </li>

                <li>
                    <a href="../proyectos/index.html">
                        Proyectos
                    </a>
                </li>

                <li>
                    <a href="index.html"
                       class="active">
                        Contacto
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>


        <section class="page-title">

            <h1>
                Contacto
            </h1>

            <p>
                Puedes ponerte en contacto conmigo.
            </p>

        </section>


        <section class="contacto">


            <div class="datos-contacto">

                <h2>
                    Información de contacto
                </h2>

                <p>
                    📧 airtonmh2007@gmail.com
                </p>

                <p>
                    📱 +51 950 753 030
                </p>

                <p>
                    📍 Lima, Perú
                </p>

            </div>


            <form id="formularioContacto">


                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Tu nombre"
                    required
                >


                <label for="correo">
                    Correo
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="tu@email.com"
                    required
                >


                <label for="mensaje">
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    rows="6"
                    placeholder="Escribe tu mensaje"
                    required
                ></textarea>


                <button
                    type="submit"
                    class="btn">

                    Enviar mensaje

                </button>


            </form>


        </section>


        <p id="resultado"></p>

    </main>


    <footer>

        <p>
            © 2026 Airton - CV Online
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
