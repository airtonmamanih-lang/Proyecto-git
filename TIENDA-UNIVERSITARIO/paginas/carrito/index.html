<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Carrito | Tienda Crema</title>

    <link
        rel="stylesheet"
        href="../style-global.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <header class="header">

        <div class="container navbar">

            <a
                href="../inicio/index.html"
                class="brand"
            >

                <span class="brand-mark">U</span>

                <span class="brand-text">
                    Tienda Crema
                </span>

            </a>


            <a
                href="../productos/index.html"
                class="btn btn-outline"
            >
                Seguir comprando
            </a>

        </div>

    </header>


    <main>

        <section class="section">

            <div class="container">

                <span class="eyebrow">
                    Tu compra
                </span>

                <h1 class="section-title">
                    Carrito
                </h1>


                <div class="cart-layout">

                    <div
                        id="cart-items"
                        class="cart-items"
                    ></div>


                    <aside class="cart-summary">

                        <h2>
                            Resumen
                        </h2>

                        <div class="summary-row">

                            <span>
                                Subtotal
                            </span>

                            <strong id="subtotal">
                                S/ 0.00
                            </strong>

                        </div>


                        <div class="summary-row">

                            <span>
                                Envío
                            </span>

                            <strong>
                                Gratis
                            </strong>

                        </div>


                        <hr>


                        <div class="summary-total">

                            <span>
                                Total
                            </span>

                            <strong id="total">
                                S/ 0.00
                            </strong>

                        </div>


                        <a
                            href="../checkout/index.html"
                            id="checkout-button"
                            class="btn btn-primary btn-full"
                        >
                            Continuar compra
                        </a>

                    </aside>

                </div>

            </div>

        </section>

    </main>


    <script src="../script-global.js"></script>

    <script src="script.js"></script>

</body>

</html>
