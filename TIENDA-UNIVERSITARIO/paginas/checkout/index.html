<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Checkout | Tienda Crema</title>

    <link
        rel="stylesheet"
        href="../style-global.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <header class="header">

        <div class="container navbar">

            <a
                href="../inicio/index.html"
                class="brand"
            >

                <span class="brand-mark">U</span>

                <span class="brand-text">
                    Tienda Crema
                </span>

            </a>

        </div>

    </header>


    <main>

        <section class="section">

            <div class="container">

                <span class="eyebrow">
                    Finalizar compra
                </span>

                <h1 class="section-title">
                    Checkout
                </h1>


                <form
                    id="checkout-form"
                    class="checkout-form"
                >


                    <div>

                        <h2>
                            Datos personales
                        </h2>


                        <div class="form-group">

                            <label class="form-label">
                                Nombre completo
                            </label>

                            <input
                                class="form-control"
                                type="text"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                class="form-control"
                                type="email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Dirección
                            </label>

                            <input
                                class="form-control"
                                type="text"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Método de pago
                            </label>

                            <select
                                class="form-control"
                                required
                            >

                                <option value="">
                                    Seleccionar
                                </option>

                                <option>
                                    Tarjeta
                                </option>

                                <option>
                                    Yape
                                </option>

                                <option>
                                    Plin
                                </option>

                            </select>

                        </div>


                        <button
                            class="btn btn-primary btn-full"
                            type="submit"
                        >
                            Confirmar pedido
                        </button>

                    </div>


                </form>

            </div>

        </section>

    </main>


    <script src="../script-global.js"></script>

    <script src="script.js"></script>

</body>

</html>
