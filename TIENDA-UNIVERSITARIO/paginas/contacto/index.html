<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contacto | Tienda Crema</title>

    <link
        rel="stylesheet"
        href="../style-global.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <header class="header">

        <div class="container navbar">

            <a
                href="../inicio/index.html"
                class="brand"
            >

                <span class="brand-mark">U</span>

                <span class="brand-text">
                    Tienda Crema
                </span>

            </a>

        </div>

    </header>


    <main>

        <section class="section">

            <div class="container">

                <span class="eyebrow">
                    Estamos para ayudarte
                </span>

                <h1 class="section-title">
                    Contacto
                </h1>


                <div class="contact-grid">


                    <div>

                        <h2>
                            ¿Tienes alguna pregunta?
                        </h2>

                        <p>
                            Escríbenos y te responderemos
                            lo antes posible.
                        </p>

                        <div class="contact-details">

                            <p>
                                📧 contacto@tiendacrema.pe
                            </p>

                            <p>
                                📱 +51 999 999 999
                            </p>

                            <p>
                                📍 Lima, Perú
                            </p>

                        </div>

                    </div>


                    <form id="contact-form">

                        <div class="form-group">

                            <label class="form-label">
                                Nombre
                            </label>

                            <input
                                class="form-control"
                                type="text"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Correo
                            </label>

                            <input
                                class="form-control"
                                type="email"
                                required
                            >

                        </div>


                        <div class="form-group">

                            <label class="form-label">
                                Mensaje
                            </label>

                            <textarea
                                class="form-control"
                                required
                            ></textarea>

                        </div>


                        <button
                            class="btn btn-primary btn-full"
                            type="submit"
                        >
                            Enviar mensaje
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <script src="../script-global.js"></script>

    <script src="script.js"></script>

</body>

</html>
