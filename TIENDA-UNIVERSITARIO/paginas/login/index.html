<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Iniciar sesión | Tienda Crema</title>

    <link
        rel="stylesheet"
        href="../style-global.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="auth-page">

        <div class="auth-card">

            <a
                href="../inicio/index.html"
                class="brand auth-brand"
            >

                <span class="brand-mark">
                    U
                </span>

                <span class="brand-text">
                    Tienda Crema
                </span>

            </a>


            <span class="eyebrow">
                Cuenta
            </span>

            <h1>
                Iniciar sesión
            </h1>

            <p>
                Accede a tu cuenta para continuar.
            </p>


            <form id="login-form">

                <div class="form-group">

                    <label class="form-label">
                        Correo
                    </label>

                    <input
                        class="form-control"
                        type="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input
                        class="form-control"
                        type="password"
                        required
                    >

                </div>


                <button
                    class="btn btn-primary btn-full"
                    type="submit"
                >
                    Ingresar
                </button>

            </form>


            <p class="auth-footer">

                ¿No tienes cuenta?

                <a href="../registro/index.html">
                    Crear cuenta
                </a>

            </p>

        </div>

    </main>


    <script src="../script-global.js"></script>

    <script src="script.js"></script>

</body>

</html>
