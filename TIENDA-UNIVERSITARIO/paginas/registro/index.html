<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registro | Tienda Crema</title>

    <link
        rel="stylesheet"
        href="../style-global.css"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <main class="auth-page">

        <div class="auth-card">

            <a
                href="../inicio/index.html"
                class="brand auth-brand"
            >

                <span class="brand-mark">
                    U
                </span>

                <span class="brand-text">
                    Tienda Crema
                </span>

            </a>


            <span class="eyebrow">
                Nueva cuenta
            </span>

            <h1>
                Registrarse
            </h1>


            <form id="register-form">

                <div class="form-group">

                    <label class="form-label">
                        Nombre
                    </label>

                    <input
                        class="form-control"
                        type="text"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Correo
                    </label>

                    <input
                        class="form-control"
                        type="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Contraseña
                    </label>

                    <input
                        class="form-control"
                        type="password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label class="form-label">
                        Confirmar contraseña
                    </label>

                    <input
                        id="password-confirm"
                        class="form-control"
                        type="password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    class="btn btn-primary btn-full"
                    type="submit"
                >
                    Crear cuenta
                </button>

            </form>


            <p class="auth-footer">

                ¿Ya tienes una cuenta?

                <a href="../login/index.html">
                    Iniciar sesión
                </a>

            </p>

        </div>

    </main>


    <script src="../script-global.js"></script>

    <script src="script.js"></script>

</body>

</html>
