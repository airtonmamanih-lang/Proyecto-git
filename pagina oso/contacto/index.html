<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi Sitio - Contacto</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header>

        <nav class="navbar">

            <h1 class="logo">
                Mi Sitio
            </h1>


            <ul class="nav-links">

                <li>
                    <a href="../menu/index.html">
                        Inicio
                    </a>
                </li>

                <li>
                    <a href="../servicios/index.html">
                        Servicios
                    </a>
                </li>

                <li>
                    <a href="../nosotros/index.html">
                        Nosotros
                    </a>
                </li>

                <li>
                    <a href="index.html" class="active">
                        Contacto
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <main>


        <section class="titulo">

            <h2>Contáctanos</h2>

            <p>
                Completa el formulario para enviarnos un mensaje.
            </p>

        </section>


        <section class="contacto">


            <form id="formularioContacto">


                <label for="nombre">
                    Nombre:
                </label>

                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >


                <label for="correo">
                    Correo electrónico:
                </label>

                <input
                    type="email"
                    id="correo"
                    placeholder="ejemplo@gmail.com"
                    required
                >


                <label for="mensaje">
                    Mensaje:
                </label>

                <textarea
                    id="mensaje"
                    rows="6"
                    placeholder="Escribe tu mensaje"
                    required
                ></textarea>


                <button type="submit">
                    Enviar mensaje
                </button>


            </form>


            <p id="resultado"></p>


        </section>

    </main>


    <footer>

        <p>
            © 2026 Mi Sitio - Todos los derechos reservados.
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
